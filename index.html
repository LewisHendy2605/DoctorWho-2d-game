<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Doctor Who 2d</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect to FontAwesome -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!--  Fonts -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Ribeye&display=swap"
      rel="stylesheet"
    />

    <!--  CSS links -->
    <link id="global" type="text/css" rel="stylesheet" />
    <link id="TitleScreen" type="text/css" rel="stylesheet" />
    <link id="TextMessage" type="text/css" rel="stylesheet" />
    <link id="SpeechBox" type="text/css" rel="stylesheet" />
    <link id="KillScreen" type="text/css" rel="stylesheet" />
    <link id="SceneTransition" type="text/css" rel="stylesheet" />
    <link id="Battle" type="text/css" rel="stylesheet" />
    <link id="Combatant" type="text/css" rel="stylesheet" />
    <link id="Team" type="text/css" rel="stylesheet" />
    <link id="SubmissionMenu" type="text/css" rel="stylesheet" />
    <link id="KeyboardMenu" type="text/css" rel="stylesheet" />
    <link id="ConsoleScreen" type="text/css" rel="stylesheet" />
    <link id="Hud" type="text/css" rel="stylesheet" />
    <link id="HudUI" type="text/css" rel="stylesheet" />
    <link id="Menus" type="text/css" rel="stylesheet" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Determine the base path based on hostname
        const basePath =
          window.location.hostname.includes("localhost") ||
          window.location.hostname.includes("127.0.0.1")
            ? ""
            : "/DoctorWho-2d-game";

        // Function to set stylesheet href
        function setStylesheet(id, path) {
          const linkElement = document.getElementById(id);
          if (linkElement) {
            linkElement.href = `${basePath}/styles/${path}`;
          } else {
            console.error(`Style link with id ${id} not found`);
          }
        }

        // List of stylesheets to load
        const stylesheets = [
          { id: "global", path: "global.css" },
          { id: "TitleScreen", path: "TitleScreen.css" },
          { id: "TextMessage", path: "TextMessage.css" },
          { id: "SpeechBox", path: "SpeechBox.css" },
          { id: "KillScreen", path: "KillScreen.css" },
          { id: "SceneTransition", path: "SceneTransition.css" },
          { id: "Battle", path: "Battle.css" },
          { id: "Combatant", path: "Combatant.css" },
          { id: "Team", path: "Team.css" },
          { id: "SubmissionMenu", path: "SubmissionMenu.css" },
          { id: "KeyboardMenu", path: "KeyboardMenu.css" },
          { id: "ConsoleScreen", path: "ConsoleScreen.css" },
          { id: "Hud", path: "Hud.css" },
          { id: "HudUI", path: "HudUI.css" },
          { id: "Menus", path: "Menus.css" },
        ];

        // Load all stylesheets
        stylesheets.forEach((style) => setStylesheet(style.id, style.path));

        // Scripts to load in order
        const scripts = [
          // Content
          "Content/pizzas.js",
          "Content/actions.js",
          "Content/enemies.js",

          // State
          "State/PlayerState.js",
          "State/TardisState.js",
          "State/SonicState.js",
          "State/MapState.js",

          // Tardis screens Scripts
          "Console/ConsoleScreen.js",
          "Console/ChangeDestScreen.js",
          "Console/EarthDestScreen.js",
          "Console/MarsDestScreen.js",
          "Console/FlyTardisScreen.js",

          // Sonic Menu
          "SonicMenu.js",

          // Objects

          // Scripts
          "utils.js",
          "AudioManager.js",
          "KeyPressListener.js",
          "DirectionInput.js",
          "TitleScreen.js",
          "InvatoryScreen.js",
          "HudUI.js",
          "Overworld.js",
          "Objects/Projectile.js",
          "Objects/GameObject.js",
          "Objects/Collectables/Titanium.js",
          "Objects/Box.js",
          "Objects/Console.js",
          "Objects/Person.js",
          "Objects/SonicScrewdriver.js",
          "Objects/Doctor.js",
          "Objects/Tardis.js",
          "Objects/Darlek.js",
          "Objects/Door.js",
          "Objects/PizzaStone.js",
          "Sprites/Sprite.js",
          "Sprites/DoctorSprite.js",
          "Sprites/DarlekSprite.js",
          "Sprites/Door64Sprite.js",
          "Sprites/BoxSprite.js",
          "Sprites/ConsoleSprite.js",
          "Sprites/TardisSprite.js",
          "OverWorldMap.js",
          "OverworldEvent.js",
          "TextMessage.js",
          "SpeechBox.js",
          "KillScreen.js",
          "RevealingText.js",
          "SceneTransition.js",
          "KeyboardMenu.js",
          "Menu.js",
          "Hud.js",
          "PauseMenu.js",
          "CraftingMenu.js",
          "Progress.js",

          // Battle scripts
          "Battle/Battle.js",
          "Battle/SubmissionMenu.js",
          "Battle/ReplacementMenu.js",
          "Battle/Team.js",
          "Battle/Combatant.js",
          "Battle/TurnCycle.js",
          "Battle/BattleEvent.js",
          "Battle/BattleAnimations.js",

          "init.js",
        ];

        // Function to load scripts in order
        function loadScriptsSequentially(index) {
          if (index >= scripts.length) return;

          const scriptElement = document.createElement("script");
          scriptElement.src = `${basePath}/${scripts[index]}`;
          scriptElement.onload = () => loadScriptsSequentially(index + 1);
          scriptElement.onerror = () =>
            console.error(`Failed to load ${scriptElement.src}`);
          document.body.appendChild(scriptElement);
        }

        // Start loading scripts
        loadScriptsSequentially(0);

        // Detect mobile device and add a class to body
        if (/Mobi|Android/i.test(navigator.userAgent)) {
          console.log("Mobile device detected");
          document.body.classList.add("mobile-device");
        } else {
          console.log("Not a mobile device");
        }

        // Prevent context menu on long press for buttons
        const buttons = document.querySelectorAll("button");
        buttons.forEach((button) => {
          button.addEventListener("contextmenu", (e) => {
            e.preventDefault();
          });
        });
      });
    </script>
  </head>
  <body>
    <div class="game-container">
      <canvas
        id="gameCanvas"
        class="game-canvas"
        width="352"
        height="198"
      ></canvas>
    </div>

    <div class="options-container">
      <div class="option-button pauseButton">
        <button class="option-button-text" id="pauseButton">Pause</button>
      </div>
      <div class="option-button actionButton">
        <button class="option-button-text" id="actionButton">Action</button>
      </div>
      <div class="option-button sonicButton">
        <button class="option-button-text" id="sonicButton">Sonic Scan</button>
      </div>
      <div class="option-button sonicShootButton">
        <button class="option-button-text" id="sonicShootButton">
          Sonic Shoot
        </button>
      </div>
    </div>

    <div class="controls-container">
      <div class="control up-control">
        <button><i class="fas fa-arrow-up control-button"></i></button>
      </div>
      <div class="control left-control">
        <button><i class="fas fa-arrow-left control-button"></i></button>
      </div>
      <div class="control right-control">
        <button><i class="fas fa-arrow-right control-button"></i></button>
      </div>
      <div class="control down-control">
        <button><i class="fas fa-arrow-down control-button"></i></button>
      </div>
    </div>
    <div class="keyboard-display">
      <div class="key key-q">
        <div class="key-label">Q</div>
        <div class="key-description">Equip Sonic</div>
      </div>
      <div class="key key-w">
        <div class="key-label">W</div>
        <div class="key-description">Move Up</div>
      </div>
      <div class="key key-e">
        <div class="key-label">E</div>
        <div class="key-description">Use Sonic</div>
      </div>
      <div class="key key-a">
        <div class="key-label">A</div>
        <div class="key-description">Move Left</div>
      </div>
      <div class="key key-s">
        <div class="key-label">S</div>
        <div class="key-description">Move Down</div>
      </div>
      <div class="key key-d">
        <div class="key-label">D</div>
        <div class="key-description">Move Right</div>
      </div>
    </div>
  </body>
</html>
